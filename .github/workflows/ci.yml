name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version=$(node --print "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      # The archive unpacks into a directory that runs as is: the bundle plus
      # production dependencies, the layout `node <dir>/index.js` expects.
      - name: Package
        run: |
          dir="remnawave-mcp-${GITHUB_REF_NAME#v}"
          mkdir "$dir"
          cp dist/index.js dist/index.js.map package.json package-lock.json "$dir/"
          (cd "$dir" && npm ci --omit=dev --ignore-scripts)
          tar --create --gzip --file "$dir.tar.gz" "$dir"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "remnawave-mcp-${GITHUB_REF_NAME#v}.tar.gz" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
